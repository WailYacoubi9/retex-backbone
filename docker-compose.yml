# Backbone ia : services partages (donnees + inference).
# Cree le reseau "ia-net" que ia-app et ia-ingestion rejoignent.
#
#   cd ia-backbone && docker compose up -d
#
services:

  build:
    image: nexus.intraknow.net/repository/docker/yieloo-app/ia/builder:3.13-beta-2
    container_name: ia-build
    restart: unless-stopped
    volumes:
      - ../ia-ingestion:/app
      - .env.builder:/app/.env
      - /mnt/data-dd01:/app/data/samples
    networks:
      - ia-net

  neo4j:
    image: nexus.intraknow.net/repository/docker/yieloo-app/ia/neo4j:5.24
    container_name: ia-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${neo4j_login}/${neo4j_pwd}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - ia-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: nexus.intraknow.net/repository/docker/yieloo-app/ia/qdrant:v1.12.4
    restart: unless-stopped
    container_name: ia-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ia-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: nexus.intraknow.net/repository/docker/yieloo-app/ia/ollama:latest
    restart: unless-stopped
    container_name: ia-ollama
    ports:
      - "11434:11434"
    volumes:
      - llm_ollama_data:/root/.ollama
    networks:
      - ia-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    image: nexus.intraknow.net/repository/docker/yieloo-app/ia/builder:3.13-beta-2
    container_name: ia-api
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ../ia-app/api:/app
    env_file: .env.app
    ports:
      - "8000:8000"
    networks:
      - ia-net
    depends_on:
      - neo4j
      - qdrant
      - ollama

  frontend:
    image: nexus.intraknow.net/repository/docker/yieloo-app/ia/builder:3.13-beta-2
    container_name: ia-frontend
    restart: unless-stopped
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    volumes:
      - ../ia-app/frontend:/app
    environment:
      API_URL: http://ia-api:8000
    ports:
      - "8501:8501"
    networks:
      - ia-net
    depends_on:
      - api

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  ollama_data:
  llm_ollama_data:
    external: true

networks:
  ia-net:
    name: ia-net
