# Backbone RETEX : services partages (donnees + inference).
# Cree le reseau "retex-net" que retex-app et retex-ingestion rejoignent.
#
#   docker compose up -d
#
# Sur une machine SANS GPU : supprime le bloc "deploy:" du service ollama.
services:

  neo4j:
    image: nexus.intraknow.net/repository/docker/yieloo-app/ia/neo4j:5.24
    container_name: retex-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - retex-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: nexus.intraknow.net/repository/docker/yieloo-app/ia/qdrant:v1.12.4
    container_name: retex-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - retex-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: nexus.intraknow.net/repository/docker/yieloo-app/ia/ollama:latest
    container_name: retex-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - retex-net

volumes:
  neo4j_data:
    external: true
    name: llm_neo4j_data
  neo4j_logs:
    external: true
    name: llm_neo4j_logs
  qdrant_data:
    external: true
    name: llm_qdrant_data
  ollama_data:
    external: true
    name: llm_ollama_data

networks:
  retex-net:
    name: retex-net
