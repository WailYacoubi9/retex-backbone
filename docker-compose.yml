# Backbone RETEX : services partages (donnees + inference).
# Cree le reseau "retex-net" que retex-app et retex-ingestion rejoignent.
#
#   docker compose up -d
#
# Sur une machine SANS GPU : supprime le bloc "deploy:" du service ollama.
services:

  neo4j:
    image: neo4j:5.24-community
    container_name: retex-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/retex_dev_pwd
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - retex-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: retex-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - retex-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: retex-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - retex-net
    # GPU NVIDIA (optionnel) -- SUPPRIMER ce bloc sur une machine sans GPU :
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  ollama_data:

networks:
  retex-net:
    name: retex-net
